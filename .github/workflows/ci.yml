name: CI

on:
  push:
  pull_request:

jobs:
  typescript:
    name: TypeScript (typecheck, tests, dashboard and site builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build the vendored confidential-token SDK
        working-directory: vendor/ctd-demo
        run: |
          pnpm install --frozen-lockfile --filter @ctd/sdk
          pnpm build:sdk
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (offline)
        run: npm test
      - name: Research prototype adversarial tests
        run: node --import tsx --test research/prototype/test/*.test.ts
      - name: Build the guardian dashboard
        run: npm run build -w @acan/web
      - name: Build the demo site
        run: npm run build -w @acan/site

  contracts:
    name: Soroban contract (tests, wasm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Tests
        run: cargo test --manifest-path contracts/Cargo.toml
      - name: Research prototype Soroban host tests
        run: cargo test --manifest-path research/prototype/soroban/Cargo.toml
      - name: Install stellar CLI (same version used for the testnet deploy)
        run: |
          mkdir -p "$HOME/stellar-cli"
          curl -sSfL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/stellar-cli"
          dirname "$(find "$HOME/stellar-cli" -type f -name stellar | head -1)" >> "$GITHUB_PATH"
      - name: Build wasm with stellar contract build
        shell: bash
        run: |
          set -o pipefail
          stellar --version
          # soroban-sdk's spec shaking requires building through the stellar CLI.
          if ! stellar contract build --manifest-path contracts/Cargo.toml 2>&1 | tee build.log; then
            # Surface the compiler error as an annotation (readable without the raw logs).
            echo "::error title=wasm build failed::$(tail -n 25 build.log | tr '\n' ' ' | cut -c1-4000)"
            exit 1
          fi
          ls -l contracts/target/wasm32v1-none/release/*.wasm
