name: Demo site

# Builds apps/site (the in-browser sandbox and live testnet view) and
# publishes it to GitHub Pages. Pages must be enabled once, with
# Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [master]
    paths:
      - "apps/site/**"
      - "packages/core/src/**"
      - "deployments/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build the site
        run: npm run build -w @acan/site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
