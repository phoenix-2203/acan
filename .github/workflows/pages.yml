name: Demo site

# Builds apps/site (the in-browser sandbox and live testnet view) and
# publishes it to GitHub Pages. Pages must be enabled once, with
# Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [master]
    paths:
      - "apps/site/**"
      - "packages/core/src/**"
      - "deployments/**"
      - ".github/workflows/pages.yml"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the build to the site-dist branch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build the site
        run: npm run build -w @acan/site
      - name: Publish the build to the site-dist branch (the VPS serves it too)
        working-directory: apps/site/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b site-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo site build of ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site-dist
          rm -rf .git
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
