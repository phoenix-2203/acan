[package]
name = "acan-cosigner-gate-policy"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "OpenZeppelin weighted-threshold policy, deployed unchanged, used by ACAN to require the provenance co-signer next to the agent"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-accounts = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
