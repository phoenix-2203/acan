[workspace]
resolver = "2"
members = ["merchant-allowlist-policy", "cosigner-gate-policy"]

[workspace.dependencies]
# Pinned to the OpenZeppelin release whose smart-account types match the
# accounts deployed on testnet (stellar-contracts v0.7.2, used by
# smart-account-kit's Protocol 27 deployment).
soroban-sdk = "26.1.0"
stellar-accounts = "=0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
