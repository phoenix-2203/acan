[package]
name = "acan-recovery-scope-policy"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "OpenZeppelin smart-account policy that limits a recovery key to one action: adding a signer to the guardian's own rule"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-accounts = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = "2.2.0"
