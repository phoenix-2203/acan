[package]
name = "acan-merchant-allowlist-policy"
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false
description = "OpenZeppelin smart-account policy: allowlist, per-recipient caps and a payment-count limit for an agent's context rule"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-accounts = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
