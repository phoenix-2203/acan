[package]
name = "acan-provenance-prototype"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Research prototype: checks in the Soroban test host that a provenance-gated agent rule needs the co-signer, using OpenZeppelin's own do_check_auth"

[lib]
doctest = false

[dependencies]
soroban-sdk = "26.1.0"
stellar-accounts = "=0.7.2"
acan-merchant-allowlist-policy = { path = "../../../contracts/merchant-allowlist-policy" }

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }
ed25519-dalek = "2.2.0"

# Standalone: not part of the contracts workspace.
[workspace]
